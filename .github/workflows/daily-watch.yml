name: Daily Tech Watch Agent

on:
  # Started every morning by Supabase (pg_cron + pg_net, see db/scheduler.sql) with
  # scheduled=true; GitHub's own cron is not used because it delays or drops runs.
  # Scheduled runs only post between 08:00 and 11:59 Paris time, once per day.
  workflow_dispatch:      # Manual trigger for testing
    inputs:
      dry_run:
        description: 'Print the Slack payload in the logs instead of posting it'
        type: boolean
        default: false
      scheduled:
        description: 'Treat as a scheduled run (morning window, one post per period). Used by the Supabase scheduler.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep scheduled runs in the 08:00-11:59 Europe/Paris window
        id: gate
        env:
          SCHEDULED: ${{ inputs.scheduled == true }}
        run: |
          hour=$(TZ=Europe/Paris date +%H)
          if [ "$SCHEDULED" = "true" ] && { [ "$hour" -lt 8 ] || [ "$hour" -ge 12 ]; }; then
            echo "Paris time is ${hour}h, outside the morning window: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0

      - name: Run non-regression tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q

      - name: Execute Daily Watch Agent
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SCHEDULED: ${{ inputs.scheduled == true }}
        run: python -m src.main

      # Unattended runs only: a manual run shows its failure in the Actions tab.
      - name: Alert Slack that the Daily Watch failed
        if: failure() && inputs.scheduled == true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n --arg url "$RUN_URL" '{text: ("⚠️ The Daily Watch failed today, so no digest was posted. Logs: " + $url)}')
          curl -sS --fail --max-time 20 -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" > /dev/null
