name: Daily Tech Watch Agent

on:
  schedule:
    # Target: 08:00 Europe/Paris (06:00 UTC in summer, 07:00 UTC in winter). GitHub may
    # delay or drop scheduled runs, so several slots fire (off the top of the hour, which
    # is the busiest time). The gate keeps runs between 08:00 and 11:59 Paris time, and
    # the agent skips the run when today's digest was already posted (Supabase).
    - cron: '7 6 * * *'
    - cron: '7 7 * * *'
    - cron: '7 8 * * *'
    - cron: '7 9 * * *'
  workflow_dispatch:      # Manual trigger for testing
    inputs:
      dry_run:
        description: 'Print the Slack payload in the logs instead of posting it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep scheduled runs in the 08:00-11:59 Europe/Paris window
        id: gate
        run: |
          hour=$(TZ=Europe/Paris date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" -lt 8 ] || [ "$hour" -ge 12 ]; }; then
            echo "Paris time is ${hour}h, outside the morning window: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run non-regression tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover tests

      - name: Execute Daily Watch Agent
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: python -m src.main
