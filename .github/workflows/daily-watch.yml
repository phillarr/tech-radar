name: Daily Tech Watch Agent

on:
  schedule:
    # 08:00 Europe/Paris is 06:00 UTC in summer and 07:00 UTC in winter. Both crons fire;
    # the first step skips the run that does not fall in the 08:00 Paris hour.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:      # Manual trigger for testing
    inputs:
      dry_run:
        description: 'Print the Slack payload in the logs instead of posting it'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep only the 08:00 Europe/Paris run
        id: gate
        run: |
          hour=$(TZ=Europe/Paris date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "08" ]; then
            echo "Paris time is ${hour}h, not the 08:00 slot: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run non-regression tests
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover tests

      - name: Execute Daily Watch Agent
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: python -m src.main
