name: Weekly Radar

on:
  # Started on Mondays, after the daily digest, by Supabase (pg_cron + pg_net, see
  # db/scheduler.sql) with scheduled=true and dry_run=false; GitHub's own cron is not
  # used. Scheduled runs only post on Monday 08:00-11:59 Paris time, once per week.
  workflow_dispatch:      # Manual trigger: covers the last 7 days up to now
    inputs:
      dry_run:
        description: 'Print the Slack payload in the logs instead of posting it'
        type: boolean
        default: true
      scheduled:
        description: 'Treat as a scheduled run (morning window, one post per period). Used by the Supabase scheduler.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-radar
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep scheduled runs in the Monday 08:00-11:59 Europe/Paris window
        id: gate
        env:
          SCHEDULED: ${{ inputs.scheduled == true }}
        run: |
          hour=$(TZ=Europe/Paris date +%H)
          day=$(TZ=Europe/Paris date +%u)
          if [ "$SCHEDULED" = "true" ] && { [ "$day" != "1" ] || [ "$hour" -lt 8 ] || [ "$hour" -ge 12 ]; }; then
            echo "Paris time is day ${day}, ${hour}h, outside the Monday morning window: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest==9.2.0

      - name: Run non-regression tests
        if: steps.gate.outputs.run == 'true'
        run: python -m pytest -q

      - name: Execute Weekly Radar
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULED: ${{ inputs.scheduled == true }}
        run: python -m src.weekly

      # Unattended runs only: a manual run shows its failure in the Actions tab.
      - name: Alert Slack that the Weekly Radar failed
        if: failure() && inputs.scheduled == true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n --arg url "$RUN_URL" '{text: ("⚠️ The Weekly Radar failed, so no radar was posted this week. Logs: " + $url)}')
          curl -sS --fail --max-time 20 -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" > /dev/null
