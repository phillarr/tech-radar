[project]
name = "tech-radar"
version = "1.0.0"
description = "Autonomous tech intelligence agent: a daily, evidence-based digest of AI, cloud and security news."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# Exact, tested versions (with their transitive dependencies) are pinned in requirements.txt.
dependencies = [
    "anthropic",
    "feedparser",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "requests",
    "tzdata",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff", "types-requests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
